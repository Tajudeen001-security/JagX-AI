name: JagX Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

jobs:
  android-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The repository keeps application code here; Flutter generates the
      # platform runners so the CI build cannot fail merely because generated
      # Android/Web scaffolding is absent from source control.
      - name: Generate platform scaffolding
        run: flutter create . --platforms android,web --project-name jagx_ai --org com.jagx
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build web --release

  android-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffolding
        run: flutter create . --platforms android --project-name jagx_ai --org com.jagx
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: jagx-ai-android-artifacts
          path: |
            apps/flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/flutter/build/app/outputs/bundle/release/app-release.aab
