name: JagX AI Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" || pip install -e .
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tokenizers pytest
      - name: Unit tests
        run: |
          pytest tests/ -v --tb=short
      - name: Model smoke
        run: |
          python -c "from evaluation.model_smoke import run_smoke_test; print(run_smoke_test())"
      - name: Eval adapters
        run: |
          python -c "from evaluation.model_eval import instruction_following_smoke, coding_shape_smoke; print(instruction_following_smoke()); print(coding_shape_smoke())"
