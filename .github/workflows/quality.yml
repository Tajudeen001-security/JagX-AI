name: JagX quality and security

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e . && pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Security smoke tests
        run: python evaluation/security_smoke.py
