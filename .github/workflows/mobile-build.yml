name: JagX AI Mobile Builds

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  mobile-validation:
    name: Mobile validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx expo config --type public
      - run: npx tsc --noEmit
      - run: npx expo export --platform web

  eas-build:
    name: EAS Android and iOS build
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Build with EAS when configured
        if: ${{ env.EXPO_TOKEN != '' }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start EAS build
        if: ${{ env.EXPO_TOKEN != '' }}
        run: eas build --platform all --non-interactive --no-wait
      - name: Explain skipped cloud build
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo 'EXPO_TOKEN is not configured; local validation completed, cloud EAS build was intentionally skipped.'
