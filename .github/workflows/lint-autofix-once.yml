name: One-time Ruff autofix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply safe Ruff fixes and formatting
        run: |
          ruff check . --fix
          ruff format .

      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/lint-autofix-once.yml
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Ruff lint and formatting issues'
          git push origin HEAD:main
