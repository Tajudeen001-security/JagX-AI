[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jagx-ai"
version = "0.2.0"
description = "Independent AI research and agent platform. Larger local models, SDPA attention, inspect CLI, gaming corpus."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "tokenizers>=0.20", "safetensors>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jagx = "jagx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "model*",
  "tokenizer*",
  "training*",
  "inference*",
  "runtime*",
  "agent*",
  "tools*",
  "security*",
  "data*",
  "evaluation*",
  "multimodal*",
  "media*",
  "safety*",
  "coding*",
  "memory*",
  "api*",
  "games*",
  "capabilities*",
  "instruction*",
  "jagx*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
  "artifacts",
]

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82",
  "F401",
  "F841",
  "E71",
  "E72",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
