[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jagx-ai"
version = "0.1.0"
description = "Independent AI research and agent platform"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "tokenizers>=0.20", "safetensors>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "model*",
  "tokenizer*",
  "training*",
  "inference*",
  "runtime*",
  "agent*",
  "tools*",
  "security*",
  "data*",
  "evaluation*",
  "multimodal*",
  "media*",
  "safety*",
  "coding*",
  "memory*",
  "api*",
  "games*",
  "capabilities*",
  "instruction*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "__pycache__",
  "artifacts",
]

[tool.ruff.lint]
# Focus on correctness and real bugs first; style debt is tracked separately.
select = [
  "E9",   # runtime syntax errors
  "F63",  # invalid print/assert
  "F7",   # syntax errors in type comments
  "F82",  # undefined names
  "F401", # unused imports
  "F841", # unused variables
  "E71",  # comparison issues
  "E72",  # bare except etc.
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
